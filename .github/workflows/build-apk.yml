name: Build Pocket Expense APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PocketExpenseAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip PocketExpenseAndroid.zip -d project
          ls -la project/PocketExpenseAndroid

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/PocketExpenseAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketExpense-APK
          path: project/PocketExpenseAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
